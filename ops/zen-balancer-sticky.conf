# panda: /etc/nginx/sites-available/zen-balancer
# TMCC 99+ — hash 粘性替代 least_conn（2026-07-03）

upstream zenproxy_v44_backend {
    hash $http_authorization consistent;
    server 127.0.0.1:4001 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:4002 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:4004 max_fails=2 fail_timeout=10s;
}

server {
    listen 0.0.0.0:4000;
    client_max_body_size 64m;

    location = /health {
        proxy_pass http://zenproxy_v44_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://zenproxy_v44_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-opencode-session $http_x_opencode_session;
        proxy_set_header x-opencode-project $http_x_opencode_project;
        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
