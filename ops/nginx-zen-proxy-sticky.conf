# nginx zen-proxy 粘性配置示例（panda 部署参考，不自动改生产）

## 目标

三实例 `zen-proxy-rs` 在 `least_conn` 下 affinity 不跨进程共享；在 nginx 层用 `hash $http_authorization consistent` 把同一 API key / session 固定到同一 upstream，配合应用层 Redis session pin。

## 示例片段

```nginx
upstream zen_proxy_backend {
    hash $http_authorization consistent;
    server 127.0.0.1:4001 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:4002 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:4004 max_fails=2 fail_timeout=10s;
}

server {
    listen 4000;
    location / {
        proxy_pass http://zen_proxy_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 透传 ClaudeCode / opencode 会话头
        proxy_set_header x-opencode-session $http_x_opencode_session;
        proxy_set_header x-opencode-project $http_x_opencode_project;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
```

## 部署步骤（panda，需人工确认）

1. 备份现有 nginx 配置
2. 将 `hash` 策略合入 `zen-proxy` upstream（或单独 vhost）
3. `nginx -t && systemctl reload nginx`
4. 观察 24h：`affinity_hit`、token 加权 cache、无 502 尖峰

## 与 zen-proxy-rs 协同

- 应用层：`session_pin`（内存/Redis）在 nginx 粘性之上做二次 pin
- `mimo-v2.5`：仅 session pin，**禁用** prefix affinity
- `deepseek-v4-flash` / `big-pickle`：session pin + prefix affinity（claude-code 16KB 门槛）
